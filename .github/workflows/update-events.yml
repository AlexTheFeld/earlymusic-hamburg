name: Update Events

on:
  schedule:
    - cron: '0 3 * * *'  # täglich um 03:00 UTC
  workflow_dispatch:       # manuell auslösbar

permissions:
  contents: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Konzertdaten holen und Seiten generieren
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python fetch_events.py

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json sitemap.xml events/
          git diff --staged --quiet || git commit -m "Update events, event pages and sitemap"
          git push
